<!DOCTYPE html>
<html>
<head>
  <title>Remind Me</title>
  <link href="dist/output.css" rel="stylesheet">
  <style>
    body {
      width: 380px;
      height: 500px;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="p-4">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Remind Me</h1>
      <button id="createReminder" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
        + New Reminder
      </button>
    </div>

    <div id="reminderForm" class="hidden bg-white rounded-lg shadow-sm p-4 mb-4">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Selected Content</label>
          <div id="selectedContent" class="mt-1 p-2 bg-gray-50 rounded-md text-sm text-gray-600"></div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Remind me in</label>
          <div class="mt-1 flex space-x-2">
            <input type="number" id="reminderTime" class="block w-20 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
            <select id="timeUnit" class="block rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
              <option value="minutes">Minutes</option>
              <option value="hours">Hours</option>
              <option value="days">Days</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Note (optional)</label>
          <textarea id="note" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></textarea>
        </div>
        <div class="border-t pt-4">
          <label class="flex items-center space-x-2">
            <input type="checkbox" id="emailNotification" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
            <span class="text-sm text-gray-700">Send email notification</span>
          </label>
          <div id="emailSettings" class="mt-2 hidden">
            <input type="email" id="emailAddress" placeholder="Enter your email"
                   class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm">
          </div>
        </div>
        <div class="flex justify-end space-x-2">
          <button id="cancelReminder" class="px-4 py-2 text-sm text-gray-700 hover:text-gray-900">Cancel</button>
          <button id="saveReminder" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">Save Reminder</button>
        </div>
      </div>
    </div>

    <div id="remindersList" class="space-y-3">
      <!-- Reminders will be dynamically inserted here -->
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
