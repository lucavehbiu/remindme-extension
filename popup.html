<!DOCTYPE html>
<html>
<head>
  <title>Set Reminder</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="output.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      width: 380px;
      min-height: 480px;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 p-6">
  <div class="max-w-md mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">
        Set Reminder
      </h1>
      <div class="h-8 w-8 rounded-full bg-gradient-to-r from-blue-500 to-indigo-500 shadow-lg"></div>
    </div>

    <!-- Content Preview -->
    <div id="content-preview" class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 transition-all duration-200 hover:shadow-md">
      <div id="preview-text" class="text-gray-600 text-sm leading-relaxed"></div>
      <img id="preview-image" class="hidden max-w-full h-auto rounded-lg mt-3 border border-gray-100" />
    </div>

    <!-- Quick Reminders -->
    <div class="space-y-3">
      <label class="block text-sm font-medium text-gray-700">Quick Reminder</label>
      <div class="grid grid-cols-2 gap-3">
        <button class="quick-reminder relative overflow-hidden group px-4 py-2.5 bg-gradient-to-br from-blue-50 to-blue-100 hover:from-blue-100 hover:to-blue-200 text-blue-700 rounded-lg text-sm font-medium transition-all duration-200 hover:shadow-md" data-minutes="30">
          30 minutes
          <div class="absolute inset-0 bg-blue-500 opacity-0 group-hover:opacity-5 transition-opacity duration-200"></div>
        </button>
        <button class="quick-reminder relative overflow-hidden group px-4 py-2.5 bg-gradient-to-br from-indigo-50 to-indigo-100 hover:from-indigo-100 hover:to-indigo-200 text-indigo-700 rounded-lg text-sm font-medium transition-all duration-200 hover:shadow-md" data-minutes="60">
          1 hour
          <div class="absolute inset-0 bg-indigo-500 opacity-0 group-hover:opacity-5 transition-opacity duration-200"></div>
        </button>
        <button class="quick-reminder relative overflow-hidden group px-4 py-2.5 bg-gradient-to-br from-purple-50 to-purple-100 hover:from-purple-100 hover:to-purple-200 text-purple-700 rounded-lg text-sm font-medium transition-all duration-200 hover:shadow-md" data-minutes="1440">
          Tomorrow
          <div class="absolute inset-0 bg-purple-500 opacity-0 group-hover:opacity-5 transition-opacity duration-200"></div>
        </button>
        <button class="quick-reminder relative overflow-hidden group px-4 py-2.5 bg-gradient-to-br from-violet-50 to-violet-100 hover:from-violet-100 hover:to-violet-200 text-violet-700 rounded-lg text-sm font-medium transition-all duration-200 hover:shadow-md" data-minutes="10080">
          Next week
          <div class="absolute inset-0 bg-violet-500 opacity-0 group-hover:opacity-5 transition-opacity duration-200"></div>
        </button>
      </div>
    </div>

    <!-- Custom Date/Time -->
    <div class="space-y-3">
      <label class="block text-sm font-medium text-gray-700">Custom Date & Time</label>
      <input type="datetime-local" id="custom-time"
        class="block w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg shadow-sm
        focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:outline-none
        text-sm text-gray-900 transition-all duration-200">
    </div>

    <!-- Email Notification -->
    <div class="space-y-3">
      <label class="block text-sm font-medium text-gray-700">Email Notification</label>
      <div class="relative">
        <input type="email" id="email" placeholder="your@email.com"
          class="block w-full pl-4 pr-10 py-2.5 bg-white border border-gray-200 rounded-lg shadow-sm
          focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:outline-none
          text-sm text-gray-900 transition-all duration-200">
        <div class="absolute inset-y-0 right-0 flex items-center pr-3">
          <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Set Reminder Button -->
    <button id="set-reminder"
      class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700
      text-white font-medium rounded-lg text-sm shadow-lg shadow-blue-500/20
      focus:outline-none focus:ring-2 focus:ring-blue-500/20
      transform transition-all duration-200 hover:scale-[1.02] active:scale-[0.98]">
      Set Reminder
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
