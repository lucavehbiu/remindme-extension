<!DOCTYPE html>
<html>
<head>
  <title>Set Reminder</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="output.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="flatpickr.min.css">
  <link rel="stylesheet" type="text/css" href="material_blue.css">
  <style>
    body {
      width: 380px;
      min-height: 480px;
      font-family: 'Inter', sans-serif;
    }
    /* Custom Flatpickr Styles */
    .flatpickr-calendar {
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      font-family: 'Inter', sans-serif;
    }
    .flatpickr-day.selected {
      background: linear-gradient(to right, #2563eb, #4f46e5);
      border-color: transparent;
    }
    .flatpickr-day.selected:hover {
      background: linear-gradient(to right, #1d4ed8, #4338ca);
      border-color: transparent;
    }
    .flatpickr-time input:hover,
    .flatpickr-time .flatpickr-am-pm:hover,
    .flatpickr-time input:focus,
    .flatpickr-time .flatpickr-am-pm:focus {
      background: #f3f4f6;
    }
    .flatpickr-day.today {
      border-color: #2563eb;
    }
    .flatpickr-day.today:hover {
      background: #f3f4f6;
      color: #2563eb;
    }
    /* V3.0 Premium Animations */
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .animate-shimmer {
      animation: shimmer 3s infinite;
      background: linear-gradient(to right, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
      background-size: 1000px 100%;
    }
  </style>
</head>
<body class="p-0 m-0 overflow-hidden" style="background: linear-gradient(to bottom, #fafafa 0%, #f5f5f5 100%);">
  <!-- New Reminder View -->
  <div id="new-reminder-view" class="hidden h-screen flex flex-col">
    <!-- Elegant Header with Subtle Gradient -->
    <div class="flex-shrink-0 backdrop-blur-xl bg-white/80 border-b border-gray-200/50 px-6 py-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl flex items-center justify-center shadow-sm" style="background: linear-gradient(135deg, #f5f5f5 0%, #e5e5e5 100%);">
            <img src="unnamed.webp" alt="Remind Me" class="w-7 h-7">
          </div>
          <div>
            <h1 class="text-lg font-semibold text-gray-900">New Reminder</h1>
            <p class="text-xs text-gray-500">Never miss what matters</p>
          </div>
        </div>
        <button id="cancel-reminder" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100/50 rounded-lg transition-all backdrop-blur-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Scrollable Content with More Space -->
    <div class="flex-1 overflow-y-auto">
      <div class="max-w-md mx-auto px-6 py-8 space-y-7">
        <!-- Glass Content Preview -->
        <div id="content-preview" class="relative overflow-hidden backdrop-blur-md bg-white/60 rounded-2xl p-5 border border-white/40 shadow-lg">
          <div class="absolute inset-0 bg-gradient-to-br from-gray-50/50 to-white/30 pointer-events-none"></div>
          <div class="relative">
            <div id="preview-text" class="text-sm text-gray-800 leading-relaxed font-medium"></div>
            <img id="preview-image" class="hidden max-w-full h-auto rounded-xl mt-3 shadow-md" />
          </div>
        </div>

        <!-- Description Field -->
        <div class="space-y-3">
          <label class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Notes</label>
          <textarea id="reminder-description"
            placeholder="Add any additional context..."
            class="block w-full px-4 py-3 backdrop-blur-sm bg-white/70 border border-gray-200/50 rounded-xl
            focus:ring-2 focus:ring-gray-900/20 focus:border-gray-900 focus:bg-white focus:outline-none
            text-sm text-gray-900 transition-all resize-none placeholder:text-gray-400 shadow-sm hover:shadow-md"
            rows="2"></textarea>
        </div>

        <!-- Priority Selector -->
        <div class="space-y-3">
          <label class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Priority</label>
          <div class="grid grid-cols-4 gap-3">
            <button type="button" data-priority="low" class="priority-btn px-3 py-3 backdrop-blur-sm bg-white/70 border-2 border-gray-200/50 rounded-xl text-xs font-medium text-gray-700 hover:border-green-500 hover:bg-green-50/50 hover:text-green-700 transition-all shadow-sm hover:shadow-md">
              <div class="flex flex-col items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-sm"></span>
                <span>Low</span>
              </div>
            </button>
            <button type="button" data-priority="medium" class="priority-btn px-3 py-3 backdrop-blur-sm bg-white/70 border-2 border-gray-200/50 rounded-xl text-xs font-medium text-gray-700 hover:border-yellow-500 hover:bg-yellow-50/50 hover:text-yellow-700 transition-all shadow-sm hover:shadow-md">
              <div class="flex flex-col items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 shadow-sm"></span>
                <span>Med</span>
              </div>
            </button>
            <button type="button" data-priority="high" class="priority-btn active px-3 py-3 backdrop-blur-sm bg-white border-2 border-gray-900 rounded-xl text-xs font-medium text-gray-900 transition-all shadow-md">
              <div class="flex flex-col items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-gray-900 shadow-sm"></span>
                <span>High</span>
              </div>
            </button>
            <button type="button" data-priority="urgent" class="priority-btn px-3 py-3 backdrop-blur-sm bg-white/70 border-2 border-gray-200/50 rounded-xl text-xs font-medium text-gray-700 hover:border-red-500 hover:bg-red-50/50 hover:text-red-700 transition-all shadow-sm hover:shadow-md">
              <div class="flex flex-col items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-sm"></span>
                <span>Urgent</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Time Picker -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-xs font-medium text-gray-700 uppercase tracking-wide">When</label>
            <button id="set-to-now" class="text-xs text-gray-600 hover:text-gray-900 font-medium px-2 py-1 hover:bg-gray-100 rounded transition-colors">
              Now
            </button>
          </div>

          <!-- Quick Actions -->
          <div class="grid grid-cols-4 gap-2">
            <button class="quick-reminder px-3 py-2.5 backdrop-blur-sm bg-white/70 border-2 border-gray-200/50 rounded-lg text-xs font-medium text-gray-700 hover:border-gray-900 hover:bg-white hover:text-gray-900 transition-all shadow-sm hover:shadow-md" data-minutes="30">
              30m
            </button>
            <button class="quick-reminder px-3 py-2.5 backdrop-blur-sm bg-white/70 border-2 border-gray-200/50 rounded-lg text-xs font-medium text-gray-700 hover:border-gray-900 hover:bg-white hover:text-gray-900 transition-all shadow-sm hover:shadow-md" data-minutes="60">
              1h
            </button>
            <button class="quick-reminder px-3 py-2.5 backdrop-blur-sm bg-white/70 border-2 border-gray-200/50 rounded-lg text-xs font-medium text-gray-700 hover:border-gray-900 hover:bg-white hover:text-gray-900 transition-all shadow-sm hover:shadow-md" data-minutes="1440">
              Tomorrow
            </button>
            <button class="quick-reminder px-3 py-2.5 backdrop-blur-sm bg-white/70 border-2 border-gray-200/50 rounded-lg text-xs font-medium text-gray-700 hover:border-gray-900 hover:bg-white hover:text-gray-900 transition-all shadow-sm hover:shadow-md" data-minutes="10080">
              Week
            </button>
          </div>

          <!-- Date Input -->
          <div class="relative">
            <input type="text" id="custom-time"
              placeholder="Custom date & time..."
              class="block w-full pl-10 pr-4 py-2.5 backdrop-blur-sm bg-white/70 border border-gray-200/50 rounded-lg
              focus:ring-2 focus:ring-gray-900/20 focus:border-gray-900 focus:bg-white focus:outline-none
              text-sm text-gray-900 transition-all placeholder:text-gray-400 shadow-sm hover:shadow-md">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Email Field -->
        <div class="space-y-2">
          <label class="text-xs font-medium text-gray-700 uppercase tracking-wide flex items-center gap-2">
            Email Backup
            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded normal-case">Optional</span>
          </label>
          <div class="relative">
            <input type="email" id="email"
              placeholder="your@email.com"
              autocomplete="email"
              class="block w-full pl-10 pr-4 py-2.5 backdrop-blur-sm bg-white/70 border border-gray-200/50 rounded-lg
              focus:ring-2 focus:ring-gray-900/20 focus:border-gray-900 focus:bg-white focus:outline-none
              text-sm text-gray-900 transition-all placeholder:text-gray-400 shadow-sm hover:shadow-md">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
          </div>
          <p class="text-xs text-gray-500">Receive notification even when offline</p>
        </div>

        <!-- Privacy Notice -->
        <div class="backdrop-blur-sm bg-white/60 border border-gray-200/50 rounded-lg p-3 shadow-sm">
          <div class="flex items-start gap-2.5">
            <svg class="w-4 h-4 text-gray-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            <p class="text-xs text-gray-600 leading-relaxed">Fully encrypted. Data stored locally. Zero tracking.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Fixed Submit Button -->
    <div class="flex-shrink-0 border-t border-gray-200/50 backdrop-blur-xl bg-white/80 px-6 py-4">
      <button id="set-reminder"
        class="w-full py-3 bg-gray-900 hover:bg-gray-800 text-white font-medium rounded-lg text-sm
        focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2
        transition-all duration-200 shadow-md hover:shadow-lg">
        Create Reminder
      </button>
    </div>
  </div>

  <!-- Reminders List View -->
  <div id="reminders-list-view" class="max-w-md mx-auto space-y-4 p-6" style="background: linear-gradient(to bottom, #fafafa 0%, #f5f5f5 100%);">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold text-gray-900 tracking-tight">
          Your Reminders
        </h1>
        <span id="reminder-count" class="text-xs text-gray-500"></span>
      </div>
      <button id="clear-all" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-white/70 rounded-lg transition-colors flex items-center gap-1 backdrop-blur-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>

    <!-- Search Bar -->
    <div class="relative">
      <input type="text" id="search-reminders" placeholder="Search reminders..."
        class="w-full pl-9 pr-4 py-2 backdrop-blur-sm bg-white/70 border border-gray-200/50 rounded-lg text-sm
        focus:ring-2 focus:ring-gray-900/20 focus:border-gray-900 focus:bg-white focus:outline-none
        placeholder:text-gray-400 transition-all duration-200 shadow-sm hover:shadow-md">
      <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>

    <!-- Tabs + Sort -->
    <div class="flex items-center justify-between gap-3">
      <!-- Tabs -->
      <div class="flex backdrop-blur-sm bg-white/50 rounded-lg p-1 shadow-sm">
        <button data-tab="active" class="tab-btn active px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-200">
          Active
        </button>
        <button data-tab="completed" class="tab-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-200">
          Past
        </button>
      </div>

      <!-- Sort Dropdown -->
      <select id="sort-reminders" class="text-xs px-2 py-1.5 backdrop-blur-sm bg-white/70 border border-gray-200/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900/20 shadow-sm">
        <option value="scheduled">By Time</option>
        <option value="priority">By Priority</option>
        <option value="created">By Created</option>
      </select>
    </div>

    <!-- Reminders List -->
    <div id="reminders-list" class="space-y-2">
      <!-- Reminders will be inserted here -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-8">
      <div class="text-gray-400 mb-4">
        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <p class="text-gray-600 font-medium">No reminders yet</p>
      <p class="text-gray-400 text-sm mt-1">Right-click on any text or image to set a reminder</p>
    </div>
  </div>

  <!-- Custom Modal for Confirmations -->
  <div id="custom-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="backdrop-blur-xl bg-white/90 rounded-2xl shadow-2xl max-w-sm w-full mx-4 animate-in border border-gray-200/50">
      <div class="p-6">
        <h3 id="modal-title" class="text-lg font-semibold text-gray-900 mb-2"></h3>
        <p id="modal-message" class="text-sm text-gray-600 mb-4"></p>
        <div id="modal-buttons" class="flex gap-2 justify-end"></div>
      </div>
    </div>
  </div>

  <!-- Custom Modal for Snooze Selection -->
  <div id="snooze-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="backdrop-blur-xl bg-white/90 rounded-2xl shadow-2xl max-w-sm w-full mx-4 animate-in border border-gray-200/50">
      <div class="p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Snooze Reminder</h3>
        <div class="space-y-2 mb-4">
          <button data-snooze-minutes="5" class="snooze-option w-full text-left px-4 py-3 rounded-lg backdrop-blur-sm bg-white/70 border border-gray-200/50 hover:border-gray-900 hover:bg-white transition-all shadow-sm hover:shadow-md">
            <span class="font-medium text-gray-900">5 minutes</span>
          </button>
          <button data-snooze-minutes="15" class="snooze-option w-full text-left px-4 py-3 rounded-lg backdrop-blur-sm bg-white/70 border border-gray-200/50 hover:border-gray-900 hover:bg-white transition-all shadow-sm hover:shadow-md">
            <span class="font-medium text-gray-900">15 minutes</span>
          </button>
          <button data-snooze-minutes="60" class="snooze-option w-full text-left px-4 py-3 rounded-lg backdrop-blur-sm bg-white/70 border border-gray-200/50 hover:border-gray-900 hover:bg-white transition-all shadow-sm hover:shadow-md">
            <span class="font-medium text-gray-900">1 hour</span>
          </button>
          <button data-snooze-minutes="180" class="snooze-option w-full text-left px-4 py-3 rounded-lg backdrop-blur-sm bg-white/70 border border-gray-200/50 hover:border-gray-900 hover:bg-white transition-all shadow-sm hover:shadow-md">
            <span class="font-medium text-gray-900">3 hours</span>
          </button>
          <button data-snooze-minutes="1440" class="snooze-option w-full text-left px-4 py-3 rounded-lg backdrop-blur-sm bg-white/70 border border-gray-200/50 hover:border-gray-900 hover:bg-white transition-all shadow-sm hover:shadow-md">
            <span class="font-medium text-gray-900">Tomorrow</span>
          </button>
        </div>
        <button id="snooze-cancel" class="w-full px-4 py-2 text-sm font-medium text-gray-700 backdrop-blur-sm bg-white/70 hover:bg-white rounded-lg transition-colors shadow-sm">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script src="flatpickr.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
